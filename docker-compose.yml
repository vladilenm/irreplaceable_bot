services:
  bot:
    build: .
    restart: unless-stopped
    # Variables must stay explicit here for Timeweb dashboard injection.
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      TARGET_CHAT_ID: "${TARGET_CHAT_ID}"
      AI_RADAR_THREAD_ID: "${AI_RADAR_THREAD_ID}"
      THREAD_SUMMARY_THREAD_ID: "${THREAD_SUMMARY_THREAD_ID}"
      TRACKED_THREAD_IDS: "${TRACKED_THREAD_IDS}"
      TIMEWEB_AI_TOKEN: "${TIMEWEB_AI_TOKEN}"
      DATABASE_URL: "${DATABASE_URL}"
      DIGEST_IMPORT_ENABLED: "${DIGEST_IMPORT_ENABLED}"
      TELEGRAM_PROXY_VLESS_URL: "${TELEGRAM_PROXY_VLESS_URL:-}"
      PRIVATE_TEST_ADMIN_ID: "${PRIVATE_TEST_ADMIN_ID:-}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
