services:
  bot:
    build: .
    restart: unless-stopped
    # Timeweb rejects volumes in compose. Mount a persistent disk at /app/data
    # in the dashboard; use docker-compose.override.yml for local bind mounts.
    # Variables must stay explicit here for Timeweb dashboard injection.
    environment:
      BOT_TOKEN: "${BOT_TOKEN}"
      TARGET_CHAT_ID: "${TARGET_CHAT_ID}"
      AI_RADAR_THREAD_ID: "${AI_RADAR_THREAD_ID}"
      AI_API_KEY: "${AI_API_KEY}"
      THREAD_SUMMARY_THREAD_ID: "${THREAD_SUMMARY_THREAD_ID}"
      DIGEST_CRON: "${DIGEST_CRON:-0 6 * * *}"
      AI_MODEL: "${AI_MODEL:-claude-sonnet-4-20250514}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      NODE_ENV: "${NODE_ENV:-production}"
      THREAD_SUMMARY_CRON: "${THREAD_SUMMARY_CRON:-30 3 * * *}"
      MESSAGE_RETENTION_DAYS: "${MESSAGE_RETENTION_DAYS:-90}"
      RETENTION_SWEEP_CRON: "${RETENTION_SWEEP_CRON:-0 1 * * *}"
      DB_PATH: "${DB_PATH:-data/messages.db}"
      TRACKED_THREAD_IDS: "${TRACKED_THREAD_IDS:-}"
      REQUEST_MATCHING_ENABLED: "${REQUEST_MATCHING_ENABLED:-false}"
      NOTION_TOKEN: "${NOTION_TOKEN:-}"
      NOTION_DATA_SOURCE_ID: "${NOTION_DATA_SOURCE_ID:-}"
      EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      MEMBER_SYNC_CRON: "${MEMBER_SYNC_CRON:-*/15 * * * *}"
      REQUEST_MATCH_CONCURRENCY: "${REQUEST_MATCH_CONCURRENCY:-2}"
      REQUEST_QUEUE_LIMIT: "${REQUEST_QUEUE_LIMIT:-50}"
      REQUEST_PROCESSING_TIMEOUT_MINUTES: "${REQUEST_PROCESSING_TIMEOUT_MINUTES:-10}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
